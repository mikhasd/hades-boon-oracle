<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hades — Boon Oracle</title>
  <meta name="description" content="Pick the best Hades boons, track ready duos, and compute your damage. Works offline." />
  <meta name="theme-color" content="#150a0c" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Boon Oracle" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===================== TOP BAR ===================== -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">🜏</span>
      <div class="brand-text">
        <h1>Boon Oracle</h1>
        <p class="brand-sub">Hades duo-boon picker</p>
      </div>
    </div>

    <div class="controls">
      <label class="search">
        <span class="search-ico">⌕</span>
        <input id="search" type="search" placeholder="Search a boon…" autocomplete="off" spellcheck="false" />
      </label>

      <div class="god-filter" id="godFilter" role="group" aria-label="Filter by god"></div>

      <div class="filter-actions">
        <button id="btnAll" class="mini-btn" type="button">All</button>
        <button id="btnNone" class="mini-btn" type="button">None</button>
      </div>
    </div>
  </header>

  <!-- ===================== DAMAGE CALCULATOR ===================== -->
  <section class="dmgpanel" id="dmgpanel" aria-label="Damage calculator">
    <div class="dp-weapon-row">
      <span class="dp-label">Weapon</span>
      <div class="dp-weapons" id="dpWeapons" role="group" aria-label="Choose weapon"></div>
    </div>
    <div class="dp-daedala-row">
      <span class="dp-label">Daedala</span>
      <div class="dp-daedala" id="dpDaedala" role="group" aria-label="Daedalus upgrades for the current weapon"></div>
    </div>
    <div class="dp-readout">
      <div class="dp-stat" id="dpAttack">
        <span class="dp-stat-name">⚔ Attack</span>
        <span class="dp-stat-val" id="dpAttackVal">–</span>
        <span class="dp-stat-note" id="dpAttackNote"></span>
      </div>
      <div class="dp-stat" id="dpSpecial">
        <span class="dp-stat-name">✦ Special</span>
        <span class="dp-stat-val" id="dpSpecialVal">–</span>
        <span class="dp-stat-note" id="dpSpecialNote"></span>
      </div>
      <div class="dp-stat" id="dpCast">
        <span class="dp-stat-name">☄ Cast</span>
        <span class="dp-stat-val" id="dpCastVal">–</span>
        <span class="dp-stat-note" id="dpCastNote"></span>
      </div>
      <div class="dp-stat dp-stat-crit">
        <span class="dp-stat-name">☠ Crit bonus</span>
        <span class="dp-stat-val" id="dpCritVal">+200%</span>
        <span class="dp-stat-note">on critical hits</span>
      </div>
      <button type="button" class="dp-toggle" id="dpToggle" aria-expanded="false">breakdown</button>
    </div>
    <div class="dp-breakdown" id="dpBreakdown"></div>
  </section>

  <!-- ===================== LANES ===================== -->
  <main class="lanes" id="lanes"></main>

  <div class="legend" id="legend">
    <span class="legend-item"><i class="mark duo-mark">◆</i> Can form a Duo Boon</span>
    <span class="legend-item"><i class="mark cand-mark"></i> Picking this completes a Duo</span>
    <span class="legend-item"><i class="mark sel-mark"></i> In your run</span>
  </div>

  <!-- ===================== LOADOUT (bottom) ===================== -->
  <footer class="loadout" id="loadout">
    <div class="loadout-row">
      <span class="loadout-label">Your boons</span>
      <div class="loadout-strip" id="selectedStrip"></div>
      <button id="btnClear" class="mini-btn ghost" type="button" hidden>Clear all</button>
    </div>
    <div class="loadout-row">
      <span class="loadout-label duo-label">Ready duos</span>
      <div class="loadout-strip" id="duoStrip"></div>
    </div>
  </footer>

  <!-- ===================== BOON POPOVER ===================== -->
  <div id="boonPop" popover class="boon-pop">
    <button class="pop-close" id="popClose" type="button" aria-label="Close">×</button>
    <div class="pop-head">
      <img id="popIcon" class="pop-icon" alt="" />
      <div class="pop-title">
        <h2 id="popName"></h2>
        <div class="pop-meta">
          <span id="popGod" class="pop-god"></span>
          <span id="popSlot" class="pop-slot"></span>
        </div>
      </div>
      <button id="popSelect" class="select-btn" type="button"></button>
    </div>
    <p id="popDesc" class="pop-desc"></p>
    <div class="pop-tuning" id="popTuning">
      <div class="pop-rarity" id="popRarity" role="group" aria-label="Boon rarity"></div>
      <div class="pop-level">
        <button type="button" class="lv-btn" id="lvDown" aria-label="Decrease level">−</button>
        <span class="lv-label">Level <b id="lvVal">1</b></span>
        <button type="button" class="lv-btn" id="lvUp" aria-label="Increase level">+</button>
        <span class="lv-lock" id="popLevelLock" hidden>fixed</span>
      </div>
    </div>
    <div class="pop-dmg" id="popDmg"></div>
    <div class="pop-duos" id="popDuoList"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
