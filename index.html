<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hades — Boon Oracle</title>
  <meta name="description" content="Pick the best Hades boons, track ready duos, and compute your damage. Works offline." />
  <meta name="theme-color" content="#150a0c" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Boon Oracle" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===================== HEADER (brand) ===================== -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">🜏</span>
      <div class="brand-text">
        <h1>Boon Oracle</h1>
        <p class="brand-sub">Hades duo-boon picker</p>
      </div>
    </div>
  </header>

  <div class="page">
    <!-- ===================== DAMAGE READOUT ===================== -->
    <section class="dmgpanel" id="dmgpanel" aria-label="Damage calculator">
      <div class="dp-readout">
        <div class="dp-stat" id="dpAttack">
          <span class="dp-stat-name">⚔ Attack</span>
          <span class="dp-stat-val" id="dpAttackVal">–</span>
          <span class="dp-stat-note" id="dpAttackNote"></span>
        </div>
        <div class="dp-stat" id="dpSpecial">
          <span class="dp-stat-name">✦ Special</span>
          <span class="dp-stat-val" id="dpSpecialVal">–</span>
          <span class="dp-stat-note" id="dpSpecialNote"></span>
        </div>
        <div class="dp-stat" id="dpCast">
          <span class="dp-stat-name">☄ Cast</span>
          <span class="dp-stat-val" id="dpCastVal">–</span>
          <span class="dp-stat-note" id="dpCastNote"></span>
        </div>
        <div class="dp-stat dp-stat-crit">
          <span class="dp-stat-name">☠ Crit bonus</span>
          <span class="dp-stat-val" id="dpCritVal">+200%</span>
          <span class="dp-stat-note">on critical hits</span>
        </div>
      </div>
      <button type="button" class="dp-toggle" id="dpToggle" aria-expanded="false">breakdown</button>
      <div class="dp-breakdown" id="dpBreakdown"></div>
    </section>

    <!-- ===================== WEAPON ===================== -->
    <section class="wpn-section" aria-label="Weapon">
      <span class="sec-label">Weapon</span>
      <div class="dp-weapons" id="dpWeapons" role="group" aria-label="Choose weapon"></div>
    </section>

    <!-- ===================== SELECTED BOONS ===================== -->
    <section class="sel-section" aria-label="Your boons">
      <div class="sel-head">
        <span class="sec-label">Your boons</span>
        <button type="button" class="new-boon-btn" id="btnNewBoon">＋ New boon</button>
      </div>
      <div class="sel-strip" id="selectedStrip"></div>
    </section>
  </div>

  <!-- ===================== PICKER OVERLAY ===================== -->
  <div class="picker" id="picker" hidden role="dialog" aria-modal="true" aria-label="Pick a boon">
    <div class="picker-backdrop" id="pickerBackdrop"></div>
    <div class="picker-panel">
      <div class="picker-head">
        <h2>Pick a boon</h2>
        <button type="button" class="picker-close" id="pickerClose" aria-label="Close">×</button>
      </div>
      <div class="picker-filter">
        <div class="god-filter" id="godFilter" role="group" aria-label="Filter by god"></div>
        <div class="legend">
          <span class="legend-item"><i class="mark duo-mark" aria-hidden="true">◆</i> Can form a Duo Boon</span>
          <span class="legend-item"><i class="mark cand-mark" aria-hidden="true"></i> Completes a Duo</span>
          <span class="legend-item"><i class="mark dae-mark" aria-hidden="true">✓</i> Selected Daedala</span>
        </div>
      </div>
      <div class="picker-lanes" id="lanes"></div>
    </div>
  </div>

  <!-- ===================== BOON POPOVER ===================== -->
  <div id="boonPop" popover class="boon-pop">
    <button class="pop-close" id="popClose" type="button" aria-label="Close">×</button>
    <div class="pop-head">
      <img id="popIcon" class="pop-icon" alt="" />
      <div class="pop-title">
        <h2 id="popName"></h2>
        <div class="pop-meta">
          <span id="popGod" class="pop-god"></span>
          <span id="popSlot" class="pop-slot"></span>
        </div>
      </div>
      <button id="popSelect" class="select-btn" type="button"></button>
    </div>
    <p id="popDesc" class="pop-desc"></p>
    <div class="pop-tuning" id="popTuning">
      <div class="pop-rarity" id="popRarity" role="group" aria-label="Boon rarity"></div>
      <div class="pop-level">
        <button type="button" class="lv-btn" id="lvDown" aria-label="Decrease level">−</button>
        <span class="lv-label">Level <b id="lvVal">1</b></span>
        <button type="button" class="lv-btn" id="lvUp" aria-label="Increase level">+</button>
        <span class="lv-lock" id="popLevelLock" hidden>fixed</span>
      </div>
    </div>
    <div class="pop-dmg" id="popDmg"></div>
    <div class="pop-duos" id="popDuoList"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
